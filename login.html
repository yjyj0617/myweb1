<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER SOCIAL - LOGIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: "Times New Roman", Times, serif; 
            color: #111; 
            background-color: #ffffff;
            padding-top: 65px; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: #fff; 
            z-index: 2000; 
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08), 
                        0 1px 4px rgba(0, 0, 0, 0.04); 
        }
        
        nav { 
            position: relative; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            height: 65px; 
        }
        
        .logo-center { 
            position: absolute; 
            left: 50%; top: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 20px; 
            font-weight: bold; 
            letter-spacing: 4px; 
            cursor: pointer; 
        }
        
        
        .btn-header-link {
            font-size: 13px !important;
            letter-spacing: 0.5px !important;
            color: #111111 !important;
            text-decoration: none !important;
            font-weight: 500 !important;
            display: inline-flex !important;
            align-items: center !important;
            transition: opacity 0.2s ease !important;
        }
        .btn-header-link:hover {
            opacity: 0.5 !important;
            text-decoration: none !important;
        }

        
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 22px;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px 0;
            font-family: inherit;
            font-size: 14px;
            border: none;
            border-bottom: 1px solid #ccc;
            outline: none;
            background: transparent;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-bottom: 1px solid #111;
        }

        
        .error-message {
            display: none;
            text-align: left;
            font-size: 11px;
            color: #b32b2b;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        
        .input-group.has-error input {
            border-bottom: 1px solid #b32b2b;
        }

        
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #111;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s ease;
        }

        .btn-login:hover {
            background-color: #333;
        }

        
        .login-sub-links {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
            color: #666;
        }

        .login-sub-links a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .login-sub-links a:hover {
            color: #111;
        }

        
        footer {
            padding: 40px 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #f5f5f5;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="nav-left">
            <a href="index.html" class="btn-header-link">홈으로</a>
        </div>
        <div class="logo-center" onclick="location.href='index.html'">SUPER SOCIAL</div>
        <div class="nav-right"></div>
    </nav>
</header>

<div class="login-wrapper">
    <div class="login-box">
        <h2>Account Login</h2>
        
        <form onsubmit="handleLogin(event)" novalidate>
            <div class="input-group" id="emailGroup">
                <input type="email" id="email" placeholder="이메일 주소" required autocomplete="username" oninput="clearError()">
                <div class="error-message" id="emailError">이메일 형식이 올바르지 않습니다.</div>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="비밀번호" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-sub-links">
            <a href="#">비밀번호 찾기</a>
            <span>|</span>
            <a href="#">회원가입</a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-container" style="max-width: 360px; margin: 0 auto; flex-direction: column; text-align: center; gap: 15px;">
        <div class="footer-links" style="margin-bottom: 0;">
            <a href="#">이용약관</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">고객센터</a>
        </div>
        <p style="font-size: 11px; color: #666;">로그인 및 회원 정보 관련 문의는 cs@supersocial.com으로 접수 바랍니다.</p>
    </div>
    <div class="footer-copyright" style="text-align: center; margin-top: 20px;">
        © 2026 SUPER SOCIAL.
    </div>
</footer>

<script>
    function handleLogin(event) {
        event.preventDefault();
        
        const emailInput = document.getElementById('email');
        const emailGroup = document.getElementById('emailGroup');
        const emailError = document.getElementById('emailError');
        
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!emailRegex.test(emailInput.value)) {
            
            emailGroup.classList.add('has-error');
            emailError.style.display = 'block';
            return;
        }
        
        
        localStorage.setItem('user', 'authenticated');
        location.href = 'index.html';
    }

    
    function clearError() {
        const emailGroup = document.getElementById('emailGroup');
        const emailError = document.getElementById('emailError');
        emailGroup.classList.remove('has-error');
        emailError.style.display = 'none';
    }
</script>

</body>
</html>
