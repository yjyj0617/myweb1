<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER SOCIAL - LOOKBOOK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        
        body { 
            font-family: "Times New Roman", Times, serif; 
            color: #111; 
            padding-top: 65px; 
            background-color: #fff; 
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        
        
        body.lookbook-dark-mode {
            background-color: #000;
            color: #fff;
        }

        
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: #fff; 
            z-index: 2000; 
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04); 
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        body.lookbook-dark-mode header {
            background: #000;
            border-bottom: 1px solid #222;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5);
        }
        
        nav { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; height: 65px; }
        .logo-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; letter-spacing: 4px; cursor: pointer; }
        
        .btn-header-link {
            font-size: 13px !important;
            letter-spacing: 0.5px !important;
            color: #111111 !important;        
            text-decoration: none !important; 
            font-weight: 500 !important;
            display: inline-flex !important;
            align-items: center !important;
            transition: opacity 0.2s ease, color 0.5s ease !important;
        }
        body.lookbook-dark-mode .btn-header-link { color: #ffffff !important; }
        .btn-header-link:hover { opacity: 0.5 !important; text-decoration: none !important; }

        body.lookbook-dark-mode .nav-link { color: #fff; }
        body.lookbook-dark-mode .dropdown-menu { background-color: #000; border: 1px solid #222; }
        body.lookbook-dark-mode .dropdown-menu a { color: #fff; }
        body.lookbook-dark-mode .dropdown-menu a:hover { background-color: #111; }

        
        .lookbook-container {
            width: 100%;
            max-width: 100%;
            padding: 60px 4% 150px 4%;
        }

        .lookbook-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 100px 30px; 
            align-items: start;
        }
        
        .lookbook-item { 
            position: relative; 
            overflow: hidden; 
            background: #f7f7f7;
            width: 100%;
            
            transition: transform 0.5s ease, opacity 0.5s ease, filter 0.5s ease; 
        }

        .lookbook-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            transition: transform 0.6s ease;
        }

        
        .lookbook-item:hover {
            transform: scale(1.02);
            z-index: 10;
            opacity: 1 !important;
            filter: blur(0px) !important; 
        }

        
        .lookbook-grid.has-hovered .lookbook-item {
            opacity: 0.3; 
            filter: blur(2px); 
        }

        
        .lookbook-item.ratio-tall { aspect-ratio: 3 / 4.6; }   
        .lookbook-item.ratio-normal { aspect-ratio: 3 / 4; }  
        .lookbook-item.ratio-square { aspect-ratio: 1.2 / 1; } 

        
        .lookbook-grid .lookbook-item:nth-child(1) { margin-top: 0px; }
        .lookbook-grid .lookbook-item:nth-child(2) { margin-top: 140px; } 
        .lookbook-grid .lookbook-item:nth-child(3) { margin-top: 40px; }
        .lookbook-grid .lookbook-item:nth-child(4) { margin-top: -60px; } 
        .lookbook-grid .lookbook-item:nth-child(5) { margin-top: 100px; }  
        .lookbook-grid .lookbook-item:nth-child(6) { margin-top: -20px; }

        
        footer { 
            background: #111111; 
            color: #888888; 
            padding: 60px 10% 40px 10%; 
            font-size: 12px; 
            line-height: 1.8; 
            border-top: 1px solid #222222; 
            width: 100%;
            text-align: left;
            transition: background 0.5s ease;
        }
        body.lookbook-dark-mode footer {
            background: #050505;
            border-top: 1px solid #111;
        }
        .footer-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .footer-left, .footer-right { flex: 1; min-width: 250px; }
        .footer-right { text-align: right; }
        .footer-title { color: #ffffff; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        .footer-links { margin-bottom: 15px; }
        .footer-links a { color: #cccccc; text-decoration: none; margin-right: 20px; transition: color 0.2s ease; }
        .footer-links a:hover { color: #ffffff; }
        .footer-copyright { margin-top: 40px; font-size: 11px; color: #555555; border-top: 1px solid #222222; padding-top: 20px; text-align: center; }

        
        @media (max-width: 768px) {
            .lookbook-container { padding: 40px 4%; }
            .lookbook-grid { grid-template-columns: repeat(1, 1fr); gap: 40px; } 
            .lookbook-grid .lookbook-item { margin-top: 0 !important; } 
            .lookbook-item.ratio-tall, .lookbook-item.ratio-normal, .lookbook-item.ratio-square { aspect-ratio: 3 / 4; }
            .footer-container { flex-direction: column; gap: 20px; }
            .footer-right { text-align: left; }
        }

        .nav-left { display: flex; align-items: center; gap: 40px; }
        .nav-right { display: flex; align-items: center; }
        .nav-link { font-size: 15px; text-transform: lowercase; cursor: pointer; color: #111; text-decoration: none; transition: color 0.5s ease; }
        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background-color: #fff; border: 1px solid #000; padding: 8px 0; min-width: 90px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); z-index: 2500; }
        .dropdown-menu a { display: block; padding: 6px 15px; font-size: 13px; text-align: left; text-transform: uppercase; cursor: pointer; color: #111; text-decoration: none; white-space: nowrap; }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="nav-left">
            <a href="index.html" class="btn-header-link">홈으로</a>
            <div class="dropdown-wrapper">
                <a href="lookbook.html" class="nav-link">lookbook</a>
                <div class="dropdown-menu">
                    <a href="lookbook.html">25 SS</a>
                    <a href="lookbook.html">24 FW</a>
                </div>
            </div>
        </div>
        <div class="logo-center" onclick="location.href='index.html'">SUPER SOCIAL</div>
        <div class="nav-right"></div>
    </nav>
</header>

<div class="lookbook-container">
    <div class="lookbook-grid" id="lookbookGrid">
        <div class="lookbook-item ratio-normal"><img src="images/lookbook-01.jpg" alt="Lookbook 1"></div>
        <div class="lookbook-item ratio-tall"><img src="images/lookbook-02.jpg" alt="Lookbook 2"></div>
        <div class="lookbook-item ratio-square"><img src="images/lookbook-03.jpg" alt="Lookbook 3"></div>
        <div class="lookbook-item ratio-tall"><img src="images/lookbook-04.jpg" alt="Lookbook 4"></div>
        <div class="lookbook-item ratio-normal"><img src="images/lookbook-05.jpg" alt="Lookbook 5"></div>
        <div class="lookbook-item ratio-tall"><img src="images/lookbook-06.jpg" alt="Lookbook 6"></div>
    </div>
</div>

<footer>
    <div class="footer-container">
        <div class="footer-left">
            <div class="footer-title">SUPER SOCIAL Showroom</div>
            <p>공식 쇼룸: 서울시 마포구 홍대로 1길 (13:00 - 21:00)</p>
            <p>협업 문의: press@supersocial.com</p>
        </div>
        <div class="footer-right">
            <div class="footer-links">
                <a href="#">Terms of Use</a>
                <a href="#">Privacy Policy</a>
            </div>
            <p>(주)슈퍼소셜 | 사업자등록번호: 000-00-00000</p>
        </div>
    </div>
    <div class="footer-copyright">
        © 2026 SUPER SOCIAL. All rights reserved.
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('lookbookGrid');
        const items = document.querySelectorAll('.lookbook-item');
        const body = document.body;

        items.forEach(item => {
            
            item.addEventListener('mouseenter', () => {
                body.classList.add('lookbook-dark-mode');
                grid.classList.add('has-hovered');       
            });

            
            item.addEventListener('mouseleave', () => {
                body.classList.remove('lookbook-dark-mode'); 
                grid.classList.remove('has-hovered');       
            });
        });
    });
</script>

</body>
</html>
